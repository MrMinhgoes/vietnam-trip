<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="300 things to do and eat in Hà Nội, Hạ Long and Phú Quốc."><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Vietnam Hit List</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,800;1,400&display=swap">
<style id="app-style">
/* Layout: one narrow column; destination tabs on top, a ticking list below, like a well-used travel notebook. */
:root{
  --bg:#eef3f1; --card:#ffffff; --ink:#12221e; --muted:#5a6b66; --line:#d4dfdb;
  --jade:#0d7560; --jade-soft:#d8ece6; --lantern:#c98a00; --lantern-soft:#fbefcf; --danger:#b23c27;
  --display:"Be Vietnam Pro",system-ui,sans-serif; --body:"Be Vietnam Pro",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1513; --card:#13201d; --ink:#e4ede9; --muted:#93a59f; --line:#23332f;
  --jade:#3fc29e; --jade-soft:#173a31; --lantern:#f0b640; --lantern-soft:#3a2f12; --danger:#f0806a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1513; --card:#13201d; --ink:#e4ede9; --muted:#93a59f; --line:#23332f;
  --jade:#3fc29e; --jade-soft:#173a31; --lantern:#f0b640; --lantern-soft:#3a2f12; --danger:#f0806a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:28px 96px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--jade);font-weight:600}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,46px);line-height:1.02;letter-spacing:-.02em;text-wrap:balance}
.sub{margin:0;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--card)}
.chip b{color:var(--ink);font-variant-numeric:tabular-nums}
.chip.save[data-s="saving"]{color:var(--lantern);border-color:var(--lantern)}
.chip.save[data-s="saved"]{color:var(--jade);border-color:var(--jade)}
.chip.save[data-s="local"]{color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:700px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tab{appearance:none;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.tab:hover{border-color:var(--jade)}
.tab[aria-selected="true"]{background:var(--jade);border-color:var(--jade);color:var(--bg)}
.tab .place{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.8;font-weight:600}
.tab .what{font-weight:600}
.tab .count{font-size:12px;font-variant-numeric:tabular-nums;opacity:.85}
.bar{height:4px;border-radius:2px;background:color-mix(in srgb,currentColor 18%,transparent);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:currentColor}
.tab:not([aria-selected="true"]) .bar i{background:var(--jade)}
.panel{display:flex;flex-direction:column;gap:14px}
.panel-head h2{margin:0;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.01em}
.panel-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
form.add{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:8px;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px}
@media (max-width:560px){form.add{grid-template-columns:minmax(0,1fr) auto}form.add #add-note{grid-column:1/-1;order:2}}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.btn{appearance:none;font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px 16px;background:var(--jade);color:var(--bg);cursor:pointer}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input{flex:1 1 200px;width:auto}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.f{appearance:none;font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.f[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
ul.items{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 12px 12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.tick{appearance:none;width:24px;height:24px;margin-top:1px;border-radius:7px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;padding:0;color:transparent}
.tick:hover{border-color:var(--jade)}
.item.done .tick{background:var(--jade);border-color:var(--jade);color:var(--bg)}
.tick svg{width:14px;height:14px}
.line{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.name{font-weight:600}
.vn{font-style:italic;color:var(--muted);font-size:14px}
.note{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.pill{font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 7px;border-radius:999px;background:var(--lantern-soft);color:var(--lantern);white-space:nowrap}
.pill.mine{background:var(--jade-soft);color:var(--jade)}
.item.done .name{text-decoration:line-through;text-decoration-color:var(--jade);text-decoration-thickness:2px}
.item.done .name,.item.done .vn,.item.done .note{opacity:.6}
.rm{appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;width:30px;height:30px;border-radius:8px;font-size:20px;line-height:1;display:grid;place-items:center}
.rm:hover{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{appearance:none;border:0;background:transparent;color:var(--lantern);font:inherit;font-weight:700;cursor:pointer}
footer{color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:no-preference){.tick,.tab,.f{transition:background .15s,border-color .15s,color .15s}}
</style>

<script type="application/json" id="state">{"v": 1, "lists": [{"key": "hn-do", "place": "Hà Nội", "what": "Things to do", "desc": "Four days in the capital, 19–22 Nov, plus day trips out of the city.", "items": [{"id": "hn-do-1", "n": "Walk Hoàn Kiếm Lake at dawn", "vn": "Hồ Hoàn Kiếm", "note": "Locals do tai chi and group dancing from about 5:30am", "done": false}, {"id": "hn-do-2", "n": "Ngọc Sơn Temple and the red Thê Húc Bridge", "vn": "Đền Ngọc Sơn", "note": "Small island temple in the middle of the lake", "done": false}, {"id": "hn-do-3", "n": "Get lost in the 36 streets of the Old Quarter", "vn": "Phố Cổ", "note": "Each street was named for the trade once sold there", "done": false, "plan": true}, {"id": "hn-do-4", "n": "Old Quarter weekend night market", "vn": "Chợ đêm Hàng Đào", "note": "Runs Fri–Sun evenings, so it's on for 20–22 Nov", "done": false, "plan": true}, {"id": "hn-do-5", "n": "Hồ Chí Minh Mausoleum", "vn": "Lăng Chủ tịch Hồ Chí Minh", "note": "Usually closed Mondays and Fridays and mornings only, so check before 20 Nov. Cover shoulders and knees", "done": false, "plan": true}, {"id": "hn-do-6", "n": "Presidential Palace and Uncle Hồ's stilt house", "vn": "Phủ Chủ tịch", "note": "Same complex as the mausoleum", "done": false, "plan": true}, {"id": "hn-do-7", "n": "One Pillar Pagoda", "vn": "Chùa Một Cột", "note": "Built to look like a lotus rising from the water", "done": false, "plan": true}, {"id": "hn-do-8", "n": "Temple of Literature", "vn": "Văn Miếu – Quốc Tử Giám", "note": "Vietnam's first university, founded 1070", "done": false, "plan": true}, {"id": "hn-do-9", "n": "Vietnam Museum of Ethnology", "vn": "Bảo tàng Dân tộc học", "note": "Full-size stilt and communal houses outside. Closed Mondays", "done": false, "plan": true}, {"id": "hn-do-10", "n": "Sunset at Trấn Quốc Pagoda on West Lake", "vn": "Chùa Trấn Quốc", "note": "Hanoi's oldest pagoda, about 1,500 years old", "done": false, "plan": true}, {"id": "hn-do-11", "n": "Coffee on Train Street", "vn": "Phố Đường Tàu", "note": "Access is sometimes restricted by police; ask a café to let you in", "done": false}, {"id": "hn-do-12", "n": "Walk across Long Biên Bridge", "vn": "Cầu Long Biên", "note": "French-built in 1903; trains and scooters only, great at sunset", "done": false}, {"id": "hn-do-13", "n": "Thăng Long water puppet show", "vn": "Múa rối nước", "note": "About 50 minutes with live traditional music. Book a day ahead", "done": false}, {"id": "hn-do-14", "n": "Hỏa Lò Prison", "vn": "Nhà tù Hỏa Lò", "note": "The \"Hanoi Hilton\". Ask about the evening tour", "done": false}, {"id": "hn-do-15", "n": "Vietnamese Women's Museum", "vn": "Bảo tàng Phụ nữ Việt Nam", "note": "Consistently one of the best museums in the city", "done": false}, {"id": "hn-do-16", "n": "Imperial Citadel of Thăng Long", "vn": "Hoàng thành Thăng Long", "note": "UNESCO World Heritage site with tunnels and bunkers", "done": false}, {"id": "hn-do-17", "n": "St Joseph's Cathedral", "vn": "Nhà thờ Lớn", "note": "Neo-Gothic, 1886. Lime tea stalls on the steps outside", "done": false}, {"id": "hn-do-18", "n": "Hanoi Opera House", "vn": "Nhà hát Lớn", "note": "Catch a show or just see it lit up at night", "done": false}, {"id": "hn-do-19", "n": "Beer Street on Tạ Hiện", "vn": "Phố Tạ Hiện", "note": "Plastic stools, cheap beer, loud and busy at night", "done": false}, {"id": "hn-do-20", "n": "Egg coffee where it was invented", "vn": "Cà phê Giảng", "note": "Mr Giảng came up with it in 1946", "done": false}, {"id": "hn-do-21", "n": "Cooking class with a market tour", "vn": "Lớp học nấu ăn", "note": "Most start with a walk through a local wet market", "done": false}, {"id": "hn-do-22", "n": "Night street food walking tour", "vn": "Tour ẩm thực đêm", "note": "Easiest way to try 8–10 dishes in one evening", "done": false}, {"id": "hn-do-23", "n": "Vespa or motorbike tour of the city", "vn": "Tour xe máy", "note": "Ride pillion with a local driver, no licence needed", "done": false}, {"id": "hn-do-24", "n": "Đồng Xuân Market", "vn": "Chợ Đồng Xuân", "note": "Biggest covered market in Hanoi", "done": false}, {"id": "hn-do-25", "n": "Silk shopping on Hàng Gai", "vn": "Phố Hàng Gai", "note": "Scarves, áo dài and tailors", "done": false, "plan": true}, {"id": "hn-do-26", "n": "Ceramic Mosaic Mural on the Red River dyke", "vn": "Con đường gốm sứ", "note": "Nearly 4 km long, once a Guinness record", "done": false}, {"id": "hn-do-27", "n": "Make a pot in Bát Tràng ceramic village", "vn": "Làng gốm Bát Tràng", "note": "About 40 minutes from the Old Quarter", "done": false}, {"id": "hn-do-28", "n": "Vạn Phúc silk village", "vn": "Làng lụa Vạn Phúc", "note": "Weaving village with an umbrella-covered lane", "done": false}, {"id": "hn-do-29", "n": "Quán Thánh Temple", "vn": "Đền Quán Thánh", "note": "Taoist temple with a huge bronze statue", "done": false}, {"id": "hn-do-30", "n": "Bạch Mã Temple", "vn": "Đền Bạch Mã", "note": "Oldest temple in the Old Quarter", "done": false}, {"id": "hn-do-31", "n": "Heritage House at 87 Mã Mây", "vn": "Nhà cổ 87 Mã Mây", "note": "Restored 19th-century tube house", "done": false}, {"id": "hn-do-32", "n": "Rooftop drink overlooking Hoàn Kiếm Lake", "vn": "Quán rooftop", "note": "Go just before sunset for the city lights", "done": false}, {"id": "hn-do-33", "n": "Lotte Center observation deck", "vn": "Đài quan sát Lotte", "note": "65th floor, glass skywalk", "done": false}, {"id": "hn-do-34", "n": "Hoàn Kiếm walking street", "vn": "Phố đi bộ Hồ Gươm", "note": "Fri–Sun evenings the roads close to traffic. Street games and buskers", "done": false}, {"id": "hn-do-35", "n": "Cyclo ride through the Old Quarter", "vn": "Xích lô", "note": "Agree the price per hour before you get in", "done": false}, {"id": "hn-do-36", "n": "Get clothes tailored", "vn": "May đo", "note": "Suits and dresses in 24–48 hours. Go early in the trip for fittings", "done": false}, {"id": "hn-do-37", "n": "Foot massage after a long walking day", "vn": "Massage chân", "note": "Old Quarter spas, about an hour", "done": false}, {"id": "hn-do-38", "n": "Live jazz at Binh Minh Jazz Club", "vn": "Câu lạc bộ Jazz Bình Minh", "note": "Behind the Opera House", "done": false}, {"id": "hn-do-39", "n": "Cycle around West Lake", "vn": "Đạp xe Hồ Tây", "note": "About 17 km loop with lots of cafés", "done": false}, {"id": "hn-do-40", "n": "Vietnam Fine Arts Museum", "vn": "Bảo tàng Mỹ thuật", "note": "Lacquer, silk painting and propaganda posters", "done": false}, {"id": "hn-do-41", "n": "B-52 wreck in Hữu Tiệp Lake", "vn": "Hồ Hữu Tiệp", "note": "Bomber wreckage still sitting in a small neighbourhood pond", "done": false}, {"id": "hn-do-42", "n": "Hanoi Flag Tower", "vn": "Cột cờ Hà Nội", "note": "Built in 1812, one of the few citadel structures left", "done": false}, {"id": "hn-do-43", "n": "Ca trù performance", "vn": "Ca trù", "note": "Traditional sung poetry, UNESCO-listed", "done": false}, {"id": "hn-do-44", "n": "Hàng Mã street for lanterns and paper decorations", "vn": "Phố Hàng Mã", "note": "Very photogenic, especially at night", "done": false}, {"id": "hn-do-45", "n": "Ninh Bình day trip: Tràng An boat ride", "vn": "Tràng An", "note": "Rowed through caves and rice fields", "done": false, "plan": true}, {"id": "hn-do-46", "n": "Climb Hang Múa viewpoint", "vn": "Hang Múa", "note": "About 500 steps for the best view in Ninh Bình", "done": false, "plan": true}, {"id": "hn-do-47", "n": "Perfume Pagoda day trip", "vn": "Chùa Hương", "note": "Boat ride then cable car to a cave temple", "done": false}, {"id": "hn-do-48", "n": "Đường Lâm ancient village", "vn": "Làng cổ Đường Lâm", "note": "Laterite-stone houses about 1.5 hours away", "done": false}, {"id": "hn-do-49", "n": "Karaoke night with the group", "vn": "Hát karaoke", "note": "Book a private room for the five of you", "done": false}, {"id": "hn-do-50", "n": "Hunt for hidden cafés up narrow stairwells", "vn": "Cà phê ẩn", "note": "Many have lake or street views from the top f     h+='<nav class="tabs" role="tablist">';
    state.lists.forEach(function(x){var dc=doneCount(x),n=x.items.length,p=n?Math.round(dc/n*100):0;
      h+='<button class="tab" role="tab" data-tab="'+esc(x.key)+'" aria-selected="'+(x.key===l.key)+'"><span class="place">'+esc(x.place)+'</span><span class="what">'+esc(x.what)+'</span><span class="count">'+dc+' / '+n+'</span><span class="bar"><i style="width:'+p+'%"></i></span></button>';});
    h+='</nav>';
    h+='<section class="panel"><div class="panel-head"><h2>'+esc(l.place)+' · '+esc(l.what)+'</h2><p>'+esc(l.desc)+'</p></div>'+
      '<form class="add" id="add-form" autocomplete="off"><input id="add-name" placeholder="Add a '+(l.what==='Food'?'dish or place to eat':'place or activity')+'" aria-label="Name"><input id="add-note" placeholder="Note (optional)" aria-label="Note"><button class="btn" type="submit">Add</button></form>'+
      '<div class="tools"><input id="search" type="search" placeholder="Search this list" aria-label="Search" value="'+esc(ui.q)+'"><div class="filters">'+
      [['all','All'],['todo','To do'],['done','Done'],['plan','In your plan']].map(function(f){return '<button class="f" data-filter="'+f[0]+'" aria-pressed="'+(ui.filter===f[0])+'">'+f[1]+'</button>';}).join('')+
      '</div></div><ul class="items" id="items"></ul></section>';
    h+='<footer>Tick things off, remove what doesn’t appeal, add your own. '+(mode==='local'?'Changes are kept in this browser.':'Changes save automatically for everyone who opens this page.')+' Starred “In your plan” items come from the itinerary sheet.</footer>';
    root.innerHTML=h;
    renderItems();
  }
  function renderItems(){
    var l=list(), q=ui.q.trim().toLowerCase(), el=document.getElementById('items');
    var rows=l.items.filter(function(it){
      if(ui.filter==='todo'&&it.done)return false;
      if(ui.filter==='done'&&!it.done)return false;
      if(ui.filter==='plan'&&!it.plan)return false;
      if(q&&(it.n+' '+(it.vn||'')+' '+(it.note||'')).toLowerCase().indexOf(q)<0)return false;
      return true;});
    if(!rows.length){el.innerHTML='<li class="empty">'+(l.items.length?'Nothing matches. Try another filter.':'This list is empty. Add your first one above.')+'</li>';return;}
    el.innerHTML=rows.map(function(it){
      return '<li class="item'+(it.done?' done':'')+'" data-id="'+esc(it.id)+'">'+
        '<button class="tick" role="checkbox" aria-checked="'+!!it.done+'" data-act="toggle" aria-label="Done: '+esc(it.n)+'"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg></button>'+
        '<div><div class="line"><span class="name">'+esc(it.n)+'</span>'+(it.vn&&it.vn!==it.n?'<span class="vn">'+esc(it.vn)+'</span>':'')+
        (it.plan?'<span class="pill">★ In your plan</span>':'')+(it.mine?'<span class="pill mine">Added</span>':'')+'</div>'+
        (it.note?'<p class="note">'+esc(it.note)+'</p>':'')+'</div>'+
        '<button class="rm" data-act="remove" aria-label="Remove '+esc(it.n)+'">×</button></li>';}).join('');
  }
  function saveText(){return {pending:'Connecting…',saved:'All changes saved',dirty:'Saving soon…',saving:'Saving…',local:'Saved in this browser'}[saveState]||'';}
  function setSave(s){saveState=s;var c=document.getElementById('save'),t=document.getElementById('save-t');if(c){c.setAttribute('data-s',s);t.textContent=saveText();}}
  function stashUI(){try{sessionStorage.setItem(SS,JSON.stringify({tab:ui.tab,filter:ui.filter,q:ui.q,scroll:window.scrollY}));}catch(e){}}

  function changed(delay){
    if(mode==='local'){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}setSave('local');return;}
    if(mode!=='shared'){try{localStorage.setItem(LS+'-pending',JSON.stringify(state));}catch(e){}return;}
    setSave('dirty');clearTimeout(timer);timer=setTimeout(flush,delay||2500);
  }
  function buildDoc(){
    var css=document.getElementById('app-style').textContent, js=document.getElementById('app-script').textContent;
    var json=JSON.stringify(state).replace(/</g,'\\u003c');
    return SKEL+'<title>Vietnam Hit List</title>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,800;1,400&display=swap">\n<style id="app-style">'+css+'</style>\n<div class="wrap" id="root"></div>\n<script type="application/json" id="state">'+json+'<\/script>\n<script id="app-script">'+js+'<\/script>\n</body></html>';
  }
  function flush(){
    clearTimeout(timer);
    var a=document.activeElement;
    if(undo||(a&&a.tagName==='INPUT'&&a.value)){timer=setTimeout(flush,2000);return;}
    setSave('saving');stashUI();
    art.publish(buildDoc()).then(function(){setSave('saved');},function(err){
      var c=err&&err.code;
      if(c==='conflict')return;
      if(c==='rate_limited'||c==='upstream_error'){setSave('dirty');timer=setTimeout(flush,8000);return;}
      mode='local';try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}setSave('local');render();
    });
  }

  root.addEventListener('click',function(e){
    var t=e.target.closest('[data-tab]');
    if(t){ui.tab=t.getAttribute('data-tab');ui.q='';stashUI();render();return;}
    var f=e.target.closest('[data-filter]');
    if(f){ui.filter=f.getAttribute('data-filter');stashUI();render();return;}
    var b=e.target.closest('[data-act]');if(!b)return;
    var li=b.closest('.item'),id=li&&li.getAttribute('data-id'),l=list(),idx=-1;
    l.items.forEach(function(it,i){if(it.id===id)idx=i;});if(idx<0)return;
    if(b.getAttribute('data-act')==='toggle'){l.items[idx].done=!l.items[idx].done;render();changed();}
    else{var it=l.items.splice(idx,1)[0];render();showUndo(l,it,idx);changed(7000);}
  });
  root.addEventListener('submit',function(e){
    if(e.target.id!=='add-form')return;e.preventDefault();
    var n=document.getElementById('add-name').value.trim(),note=document.getElementById('add-note').value.trim();
    if(!n){document.getElementById('add-name').focus();return;}
    list().items.unshift({id:'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),n:n.slice(0,140),vn:'',note:note.slice(0,240),done:false,mine:true});
    ui.filter='all';ui.q='';render();document.getElementById('add-name').focus();changed();
  });
  root.addEventListener('input',function(e){if(e.target.id==='search'){ui.q=e.target.value;stashUI();renderItems();}});

  function showUndo(l,it,idx){
    clearTimeout(undoTimer);var old=document.querySelector('.toast');if(old)old.remove();
    undo={l:l,it:it,idx:idx};
    var d=document.createElement('div');d.className='toast';d.setAttribute('role','status');
    d.innerHTML='<span>Removed “'+esc(it.n)+'”</span><button type="button">Undo</button>';
    d.querySelector('button').onclick=function(){if(undo){undo.l.items.splice(undo.idx,0,undo.it);undo=null;d.remove();render();changed();}};
    document.body.appendChild(d);
    undoTimer=setTimeout(function(){undo=null;d.remove();},6000);
  }
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&mode==='shared'&&saveState==='dirty'){undo=null;flush();}});

  render();
  if(ui.scroll)setTimeout(function(){window.scrollTo(0,ui.scroll);},50);

  var useP=(window.claude&&window.claude.use)?window.claude.use('artifact').catch(function(){return null;}):Promise.resolve(null);
  useP.then(function(a){
    if(a){art=a;mode='shared';
      var pend=null;try{pend=JSON.parse(localStorage.getItem(LS+'-pending')||'null');localStorage.removeItem(LS+'-pending');}catch(e){}
      if(pend&&pend.lists){state=pend;render();changed();}else setSave('saved');
    }else{
      mode='local';
      try{var s=JSON.parse(localStorage.getItem(LS)||localStorage.getItem(LS+'-pending')||'null');if(s&&s.lists)state=s;}catch(e){}
      saveState='local';render();
    }
  });
})();
</script>

</body></html>
